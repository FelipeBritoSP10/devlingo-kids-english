<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo | DevLingo Kids English</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/game.css">
</head>

<body class="game-page min-vh-100 py-4">

    <div class="container" style="max-width: 640px;">

        <header class="d-flex justify-content-between align-items-center gap-2 mb-3">
            <a href="worlds.html" id="btn-back-worlds" class="btn btn-light rounded-pill fw-bold">
                ← Mundos
            </a>
            <span id="current-world-label" class="fw-bold text-primary">
                🐾 Animals
            </span>
        </header>

        <div id="sr-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
        <devlingo-header id="app-header"></devlingo-header>
        <main id="game-screen" class="card border-2 rounded-5 shadow-sm p-4 p-md-5 text-center bg-white" style="border-color: var(--accent-blue-border) !important;">
        <devlingo-step-choose id="step-choose"></devlingo-step-choose>
        <devlingo-step-speak id="step-speak" class="d-none"></devlingo-step-speak>
        </main>

    </div>

    <devlingo-hint-modal id="hint-modal"></devlingo-hint-modal>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script type="module" src="../js/game.js"></script>

</body>
</html>
