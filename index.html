<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevLingo Kids English</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
  <!-- Confetti JS -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center py-4">

  <!-- Tela de Inicialização -->
  <div id="start-overlay">
    <div class="start-card text-center">
      <div id="mascot" class="mascot-interactive mb-2" role="button" tabindex="0" aria-label="Mascote interativo">🐶</div>
      <h1 class="fw-black text-dark mb-1 fs-2">DevLingo <span style="color: var(--accent-blue);">Kids</span></h1>
      <p class="text-secondary fw-bold fs-6 mb-4">Aprenda inglês no seu ritmo!</p>

      <button id="btn-start-game" class="btn btn-play-interactive btn-lg rounded-pill px-5 py-3 fs-3 w-100 mb-3 shadow-sm">
        ▶️ PLAY
      </button>

      <div class="d-flex justify-content-center gap-2">
        <span class="badge rounded-pill badge-accessibility px-3 py-2 fw-semibold">🔊 Som Ativo</span>
        <span class="badge rounded-pill badge-accessibility px-3 py-2 fw-semibold">🎙️ Voz Ativa</span>
      </div>
    </div>
  </div>

  <div id="sr-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <div class="container" style="max-width: 640px;">
    <devlingo-header id="app-header"></devlingo-header>

    <main class="card border-2 rounded-5 shadow-sm p-4 p-md-5 text-center bg-white" style="border-color: var(--accent-blue-border) !important;">
      <devlingo-step-choose id="step-choose"></devlingo-step-choose>
      <devlingo-step-speak id="step-speak" class="d-none"></devlingo-step-speak>
    </main>
  </div>

  <devlingo-hint-modal id="hint-modal"></devlingo-hint-modal>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
