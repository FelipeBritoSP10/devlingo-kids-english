<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevLingo Kids English: aprenda inglês brincando com animais, cores, números e muito mais.">
  <meta name="theme-color" content="#eff6ff">
  <title>DevLingo Kids English</title>
  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>
  <!-- Estilos da aplicação -->
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="styles/worlds.css">
</head>

<body class="min-vh-100 py-4">

  <!-- Tela inicial componentizada -->
  <devlingo-start-screen></devlingo-start-screen>

  <!-- Anúncios acessíveis para leitores de tela -->
  <div id="sr-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <div class="container" style="max-width: 1100px;">

    <!-- Cabeçalho -->
    <devlingo-header id="app-header"></devlingo-header>

    <div class="text-start my-3">
      <button id="btn-home" type="button" class="btn btn-outline-primary rounded-pill fw-bold px-4">
        🏠 Voltar ao início
      </button>
    </div>

    <!-- Seleção de mundos componentizada -->
    <devlingo-worlds-screen id="worlds-screen" class="d-none" aria-labelledby="worlds-title"></devlingo-worlds-screen>

    <!-- Área principal do jogo -->
    <main id="game-screen" class="card border-2 rounded-5 shadow-sm p-4 p-md-5 text-center bg-white d-none"
      style="border-color: var(--accent-blue-border) !important;">
      <devlingo-step-choose id="step-choose"></devlingo-step-choose>
      <devlingo-step-speak id="step-speak" class="d-none"></devlingo-step-speak>
    </main>

  </div>

  <!-- Modal de dicas -->
  <devlingo-hint-modal id="hint-modal"></devlingo-hint-modal>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>

</body>
</html>
